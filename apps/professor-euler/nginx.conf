server {
    listen 8080;
    server_name euler.dawei7.com;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
