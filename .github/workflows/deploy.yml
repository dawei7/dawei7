# This workflow deploys the full server stack (infrastructure services).
# Runs directly on the self-hosted runner on the VPS — no inbound SSH needed.

name: Deploy Server Stack

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to dawei7.com
    runs-on: self-hosted
    environment: production
    if: github.repository_owner == 'dawei7' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull latest config & restart stack
        env:
          PLAY_SERVICE_ACCOUNT_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_B64 }}
          EULER_STATS_SMTP_PASSWORD: ${{ secrets.EULER_STATS_SMTP_PASSWORD }}
          EULER_STATS_ADMIN_SECRET: ${{ secrets.EULER_STATS_ADMIN_SECRET }}
        run: |
          set -e
          cd /opt/server

          echo "Pulling latest config..."
          git fetch origin main
          git reset --hard origin/main

          mkdir -p /opt/server/secrets
          if [ -n "$PLAY_SERVICE_ACCOUNT_B64" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_B64" | base64 -d > /opt/server/secrets/play-service-account.json
            chmod 600 /opt/server/secrets/play-service-account.json
          fi

          echo "Pulling latest images..."
          docker compose pull --ignore-buildable || echo "WARNING: some images failed to pull, continuing with cached versions"

          echo "Building local images..."
          docker compose build socket-proxy ancestry professor-euler euler-stats

          echo "Restarting services..."
          docker compose up -d --remove-orphans

          echo "Cleaning up old images..."
          docker image prune -f

          echo "Deploy complete ✓"
