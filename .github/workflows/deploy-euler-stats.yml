name: Deploy euler-stats

on:
  push:
    branches: [main]
    paths:
      - "apps/euler-stats/**"
      - "postgres/init/03-euler-stats.sql"
      - ".github/workflows/deploy-euler-stats.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/euler-stats
  APP_DIR: apps/euler-stats

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=euler-stats
          cache-to: type=gha,mode=max,scope=euler-stats

  deploy:
    name: Deploy on VPS
    runs-on: self-hosted
    needs: build
    environment: production
    if: github.repository_owner == 'dawei7' && github.ref == 'refs/heads/main'

    steps:
      - name: Apply DB schema
        run: |
          cd /opt/server
          set -a && source .env && set +a
          docker exec -i postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" < postgres/init/03-euler-stats.sql

      - name: Pull & restart
        env:
          IMAGE: ${{ env.IMAGE }}
          PLAY_SERVICE_ACCOUNT_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_B64 }}
        run: |
          set -e
          cd /opt/server
          mkdir -p /opt/server/secrets
          if [ -n "$PLAY_SERVICE_ACCOUNT_B64" ]; then
            printf '%s' "$PLAY_SERVICE_ACCOUNT_B64" | base64 -d > /opt/server/secrets/play-service-account.json
            chmod 600 /opt/server/secrets/play-service-account.json
          fi
          docker compose pull euler-stats
          docker compose up -d --no-deps euler-stats
          docker image prune -f
          echo "euler-stats deployed ✓"
